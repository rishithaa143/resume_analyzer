<!DOCTYPE html>
<html>
<head>
    <title>Resume Analysis</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            color: #333;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 50%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Resume Analysis Result</h1>

    <div class="box">
        <h2>Skills Found</h2>
        {% if skills %}
            <p>{{ skills }}</p>
        {% else %}
            <p>No skills detected ❌</p>
        {% endif %}
    </div>

    <div class="box">
        <h2>Resume Score</h2>
        {% if score %}
            <p>{{ score }}%</p>
        {% else %}
            <p>Score not available ❌</p>
        {% endif %}
    </div>

    <a href="/dashboard" class="btn">Go Back</a>
</div>

</body>
</html>
