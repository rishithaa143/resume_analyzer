<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #00c6ff;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Home Page</h2>

        <a href="/login1">
            <button class="btn">Login</button>
        </a>

        <a href="/signup1">
            <button class="btn">Signup</button>
        </a>
    </div>

</body>
</html>
